[project]
name = "athena"
version = "0.1.0"
description = "Vendor-agnostic, event-driven AI Knowledge Operating System for an Obsidian vault"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-frontmatter>=1.1.0",
    "pyyaml>=6.0",
    "huey>=2.5.0",
    "detect-secrets>=1.5.0",
    "aiosqlite>=0.20.0",
    "watchdog>=5.0.0",
    "chonkie>=1.7.0",
    "sentence-transformers>=6.0.0",
    "fastembed>=0.7.0",
    "qdrant-client>=1.16.0",
    "datasketch>=2.0.0",
    "mcp>=2.1.1",
    "httpx>=0.28.1",
    "trafilatura>=2.2.0",
    # CVE-2026-41066 (lxml XXE, GHSA-vfmq-68hx-4jfw): trafilatura 2.2.0's own
    # minimum (>=6.1.1) postdates the fix, but pin past it explicitly anyway
    # -- same discipline applied to sentence-transformers/CVE-2026-68770.
    "lxml>=6.1.3",
]

[project.scripts]
athena = "athena.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/athena"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "A"]
# S101: allow `assert` in tests.
per-file-ignores = { "tests/**/*.py" = ["S101"] }

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
# huey ships no py.typed marker/stubs (verified during hardening-module implementation).
module = "huey.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# datasketch 2.0.0 ships no py.typed marker/stubs (verified during
# knowledge-intelligence duplicate-detection implementation), despite its
# own source using inline type hints.
module = "datasketch.*"
ignore_missing_imports = true
